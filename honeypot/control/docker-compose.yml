version: '3.8'

services:
  # --- THE TRAFFIC CAPTOR ---
  cowrie_shell:
    image: cowrie/cowrie:latest
    container_name: aws_cowrie_control
    restart: always
    # Bind standard SSH (22) and Telnet (23) on AWS to Cowrie's internal ports
    ports:
      - "22:2222"
      - "23:2223"
    environment:
      - TZ=UTC
    # --- HARDENING PROPERTIES ---
    security_opt:
      - no-new-privileges:true  # Prevents processes from gaining more privileges (like SUID elevation)
    read_only: true              # Makes the container's core root filesystem strictly read-only
    tmpfs:
      - /tmp:rw,noexec,nosuid   # Allows Cowrie to write temp files, but blocks execution of scripts in /tmp
    deploy:
      resources:
        limits:
          cpus: '0.50'          # Prevents attackers from using your CPU to mine crypto
          memory: 512M          # Prevents Denial of Service (DoS) memory exhaustion attacks
    # ----------------------------
    # Cowrie's process actually runs from /cowrie/cowrie-git (that's its CWD,
    # confirmed via /proc/1/cwd on a running container) -- NOT
    # /home/cowrie/cowrie. Every relative path in cowrie.cfg.dist (etc_path,
    # log_path, download_path) resolves against that CWD. Mounting anything
    # under /home/cowrie/cowrie is silently ignored: Docker just creates an
    # empty directory tree there and Cowrie never looks at it, which is why
    # this config/userdb were never actually loaded in any prior deploy.
    volumes:
      - ./cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - shell_logs:/cowrie/cowrie-git/var/log/cowrie
      - shell_downloads:/cowrie/cowrie-git/var/lib/cowrie/downloads

    networks:
      - frontend_net

  # --- THE LOG SHIPPER ---
  log_shipper:
    image: timberio/vector:latest-alpine
    container_name: aws_vector_shipper
    restart: always
    # The image's entrypoint defaults to /etc/vector/vector.yaml when no
    # --config is given -- without this it silently crash-loops looking for
    # a file we never mount.
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      # Vector reads configuration and parses shared logs from the shell
      - ./vector.toml:/etc/vector/vector.toml:ro
      # Read-only access for safety
      - shell_logs:/var/log/cowrie:ro
      - ./gcp_key.json:/etc/vector/gcp_key.json:ro
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_PUBSUB_TOPIC=${GCP_PUBSUB_TOPIC}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/vector/gcp_key.json
    depends_on:
      - cowrie_shell
    networks:
      - frontend_net

volumes:
  shell_logs:
  # Added to keep track of any scripts the agents tries to fetch.
  shell_downloads:

networks:
  frontend_net:
    driver: bridge
