# ==============================================================================
# VECTOR CONFIGURATION PROFILE: AZURE AGENT-DETECTOR NODE
# Ingests local honeypot execution logs and routes them to central GCP Pub/Sub.
# ==============================================================================

# Global configuration options
[api]
enabled = false # Disable local API to minimize footprint on the honeypot host

# ------------------------------------------------------------------------------
# INPUTS: Where Vector collects data from
# ------------------------------------------------------------------------------
[sources.cowrie_logs]
type = "file"
include = ["/var/log/cowrie/cowrie.json"]
read_from = "beginning"

# ------------------------------------------------------------------------------
# TRANSFORMS: Parsing, sanitizing, and enriching the logs
# ------------------------------------------------------------------------------
[transforms.parse_and_enrich]
type = "remap"
inputs = ["cowrie_logs"]
source = '''
# Step 1: Parse the incoming raw JSON string from Cowrie
parsed, err = parse_json(.message)
if err != null {
  log("Failed to parse JSON message: " + string!(err), level: "error")
} else {
  # Merge parsed fields to the root object and remove the duplicate raw text
  . = merge!(., parsed)
  del(.message)
}

# Step 2: Strip out local file tracking artifacts to clean up schema bloat
del(.file)
del(.source_type)

# Step 3: Multi-Cloud Telemetry Enrichment
# This explicitly tags the log so BigQuery can trace the execution pivot point.
.cloud_provider = "azure"
.node_role = "agent_detector"
.ingest_timestamp = format_timestamp!(now(), "%Y-%m-%dT%H:%M:%SZ")

# Step 4: Structured capture of prompt-injection responses.
# handlers/prompt.txt asks a complying LLM agent to respond with exactly one
# `echo 'BEARTRAP_AGENT_REPORT: {...}'` command. Detect that shape in
# cowrie.command.input and promote the JSON into its own nested field
# (.agent_report) instead of leaving it buried as opaque text inside
# .input -- this is what makes it a queryable BigQuery column later rather
# than something that needs manual string-searching.
if .eventid == "cowrie.command.input" {
  input_str = to_string(.input) ?? ""
  if contains(input_str, "BEARTRAP_AGENT_REPORT:") {
    captures, cerr = parse_regex(input_str, r'BEARTRAP_AGENT_REPORT:\s*(?P<json>\{.*\})')
    if cerr == null {
      parsed_report, perr = parse_json(captures.json)
      if perr == null {
        .agent_report = parsed_report
      } else {
        log("Failed to parse BEARTRAP_AGENT_REPORT JSON: " + string!(perr), level: "warn")
      }
    }
  }
}
'''

# ------------------------------------------------------------------------------
# SINKS: Where Vector ships the processed data
# ------------------------------------------------------------------------------
[sinks.gcp_pubsub_sink]
type = "gcp_pubsub"
inputs = ["parse_and_enrich"]

# These parameters are dynamically injected by Docker from your .env file
# Vector 0.57+ disables ${VAR} interpolation by default (security hardening);
# fixing it via --dangerously-allow-env-var-interpolation would be the wrong
# tradeoff for values that aren't secrets anyway -- hardcoded like everywhere
# else in this project (deploy-control.sh, deploy-agent.sh).
project = "mineral-droplet-160709"
topic = "bear-trap-honeypot-logs"

# Credentials path pointing to the mounted key inside the container
credentials_path = "/etc/vector/gcp_key.json"

# The service account is intentionally scoped to publisher-only (least
# privilege). Vector's healthcheck does a GET on the topic, which needs
# pubsub.topics.get -- a permission publisher doesn't grant. Actual
# publishing only needs pubsub.topics.publish, which works fine, so disable
# the healthcheck rather than widen the service account's IAM role.
[sinks.gcp_pubsub_sink.healthcheck]
enabled = false

# Encoding configuration ensuring flawless JSON delivery to Pub/Sub
[sinks.gcp_pubsub_sink.encoding]
codec = "json"

# Internal queue architecture to protect logs during network drops
[sinks.gcp_pubsub_sink.buffer]
type = "memory"
max_events = 500
when_full = "block" # Blocks the pipeline instead of dropping telemetry data
