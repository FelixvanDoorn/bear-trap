# .pre-commit-config.yaml
repos:
  # Basic syntax safety rules for your mixed-language repo
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace   # Trims unnecessary trailing spaces
      - id: end-of-file-fixer     # Ensures code ends with a clean newline
      - id: check-yaml            # Validates your commands.yaml layout
      - id: check-added-large-files

  # The main event: Running Ruff's ultra-fast engine
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20 # Keeps it tracking current production releases
    hooks:
      # Hook 1: Analyzes your python hooks/scripts and automatically fixes violations
      - id: ruff-check
        args: [ --fix ]
      # Hook 2: Handles your styling, layout formatting, and indentation matches
      - id: ruff-format

  # Lints the BigQuery view SQL in honeypot/sink-node/ (dialect + rules in .sqlfluff).
  # fix runs first so lint is checking the already-fixed file and only fails
  # on what fix couldn't handle -- same relationship ruff-check --fix has to
  # ruff-format above.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-fix
        files: \.sql$
      - id: sqlfluff-lint
        files: \.sql$
