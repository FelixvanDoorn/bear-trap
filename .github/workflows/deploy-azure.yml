name: Bear Trap Azure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'honeypot/agent-sensor/**'
      - '.github/workflows/deploy-azure.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'honeypot/agent-sensor/**'
      - '.github/workflows/deploy-azure.yml'

permissions:
  # REQUIRED for Azure OIDC authentication
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: CI & Config Validation
  # ============================================================================
  validate:
    name: Lint & Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Validate Vector syntax (passing dummy env vars so validation succeeds)
      # Dummy env and vars specified, as these are defined in the current vector.toml
      # Omission would lead to crashes.
      - name: Validate Vector TOML Configuration
        uses: addnab/docker-run-action@v3
        with:
          image: timberio/vector:0.38.X-debian
          options: -v ${{ github.workspace }}:/workspace -w /workspace -e GCP_PROJECT_ID=dummy-project -e GCP_PUBSUB_TOPIC=dummy-topic
          run: |
            # Create a dummy credentials file so the schema check passes
            mkdir -p /etc/vector
            cat << 'EOF' > /etc/vector/gcp_key.json
            {
              "type": "service_account",
              "project_id": "ci-dummy-project",
              "private_key_id": "dummy",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n",
              "client_email": "ci-dummy@ci-dummy-project.iam.gserviceaccount.com"
            }
            vector validate ./honeypot/agent-sensor/vector.toml

      # Validate Docker Compose syntax
      - name: Validate Docker Compose Spec
        run: |
          cd honeypot/agent-sensor
          docker compose config --quiet

      # Our agent-sensor node has some additional python scripts.
      # Adding linting and testing for these.
      - name: Set up Python for testing and linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install uv (Takes ~1-2 seconds)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Install lightweight tooling
      - name: Install deps needed for testing and linting.
        run: |
          uv sync --group test

      # Fast syntax and code quality checks
      - name: Lint Python Code with Ruff
        run: |
          uv run ruff check .

      # Run tests
      - name: Run Pytest
        run: |
          uv run pytest

  # ============================================================================
  # STAGE 2: Automated Deployment
  # ============================================================================
  deploy:
    name: Deploy Honeypot Node to Azure
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # TODO: replace with the real App Registration / Managed Identity IDs once
      # the federated credential trusting this repo/branch has been created.
      - name: Configure Azure Credentials via OIDC
        uses: azure/login@v2
        with:
          client-id: 'ce303bb3-ee5e-4b65-a652-55a048e597b4'
          tenant-id: '298b7d65-5cda-4042-87f0-9a32a8bec63e'
          subscription-id: '0557b42e-187b-40e7-a736-7db46bff5bc3'

      - name: Get Runner IP
        id: ip
        run: echo "runner_ip=$(curl -s https://ifconfig.me)" >> $GITHUB_OUTPUT

      # Pinned to a release known to bundle Python 3.13 -- azure-cli builds from
      # ~2.67.0 onward pick up a Python 3.14 interpreter that deadlocks under
      # az-cli's threaded module/credential loading (Azure/azure-cli#32980, #32869,
      # still open as of writing). Revisit once that's fixed upstream.
      - name: Authorize NSG Ingress
        uses: azure/CLI@v2
        with:
          azcliversion: 2.66.0
          inlineScript: |
            az network nsg rule create \
              --resource-group bear-trap-agent-node \
              --nsg-name bear-trap-agent-node-nsg \
              --name github-runner-temp \
              --priority 100 \
              --access Allow \
              --direction Inbound \
              --protocol Tcp \
              --destination-port-ranges 22222 \
              --source-address-prefixes ${{ steps.ip.outputs.runner_ip }}/32

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Deploy through SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22222 20.106.204.124 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p 22222 azureuser@20.106.204.124 "
            if [ -d ~/bear-trap/.git ]; then
              git -C ~/bear-trap fetch origin main && git -C ~/bear-trap reset --hard origin/main
            else
              git clone https://github.com/FelixvanDoorn/bear-trap.git ~/bear-trap
            fi
            cd ~/bear-trap/honeypot/agent-sensor
            chmod +x deploy-agent.sh
            ./deploy-agent.sh
          "

      - name: Revoke NSG Ingress
        if: always()
        uses: azure/CLI@v2
        with:
          azcliversion: 2.66.0
          inlineScript: |
            az network nsg rule delete \
              --resource-group bear-trap-agent-node \
              --nsg-name bear-trap-agent-node-nsg \
              --name github-runner-temp
