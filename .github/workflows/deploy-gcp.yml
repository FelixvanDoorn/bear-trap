name: Bear Trap GCP CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'sink-node/**'
      - '.github/workflows/deploy-gcp.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'sink-node/**'
      - '.github/workflows/deploy-gcp.yml'

jobs:
  # ============================================================================
  # STAGE 1: CI & Config Validation
  # ============================================================================
  validate:
    name: Lint & Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
