name: Bear Trap AWS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'honeypot/control/**'
      - '.github/workflows/deploy-aws.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'honeypot/control/**'
      - '.github/workflows/deploy-aws.yml'

permissions:
  # REQUIRED for AWS OIDC authentication
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: CI & Config Validation
  # ============================================================================
  validate:
    name: Lint & Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Validate Vector syntax (passing dummy env vars so validation succeeds)
      # Dummy env and vars specified, as these are defined in the current vector.toml
      # Omission would lead to crashes.
      - name: Validate Vector TOML Configuration
        uses: addnab/docker-run-action@v3
        with:
          image: timberio/vector:0.38.X-debian
          options: -v ${{ github.workspace }}:/workspace -w /workspace -e GCP_PROJECT_ID=dummy-project -e GCP_PUBSUB_TOPIC=dummy-topic
          run: |
            # Create a dummy credentials file so the schema check passes
            mkdir -p /etc/vector
            cat << 'EOF' > /etc/vector/gcp_key.json
            {
              "type": "service_account",
              "project_id": "ci-dummy-project",
              "private_key_id": "dummy",
              "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n",
              "client_email": "ci-dummy@ci-dummy-project.iam.gserviceaccount.com"
            }
            vector validate ./honeypot/control/vector.toml

      # Validate Docker Compose syntax
      - name: Validate Docker Compose Spec
        run: |
          cd honeypot/control
          docker compose config --quiet

  # ============================================================================
  # STAGE 2: Automated Deployment
  # ============================================================================
  deploy:
    name: Deploy Honeypot Node to AWS
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::808198485584:role/BearTrap-Control-Node-GitHubActions-EC2-Deployer
          aws-region: eu-north-1

      - name: Get Runner IP
        id: ip
        run: echo "runner_ip=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Authorize Security Group Ingress
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0217be33d7918a365 \
            --protocol tcp \
            --port 22222 \
            --cidr ${{ steps.ip.outputs.runner_ip }}/32

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy through SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22222 16.16.156.14 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p 22222 ubuntu@16.16.156.14 "
            if [ -d ~/bear-trap/.git ]; then
              git -C ~/bear-trap pull
            else
              git clone https://github.com/FelixvanDoorn/bear-trap.git ~/bear-trap
            fi
            cd ~/bear-trap/honeypot/control
            chmod +x deploy-control.sh
            ./deploy-control.sh
          "

      - name: Revoke Security Group Ingress
        if: always()
        run: |
          if [ -n "${{ steps.ip.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id sg-0217be33d7918a365 \
              --protocol tcp \
              --port 22222 \
              --cidr ${{ steps.ip.outputs.runner_ip }}/32
          fi
