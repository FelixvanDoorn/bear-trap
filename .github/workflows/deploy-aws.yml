name: Bear Trap AWS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'honeypot/control/**'
      - '.github/workflows/deploy-aws.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'honeypcontrol/**'
      - '.github/workflows/deploy-aws.yml'

jobs:
  # ============================================================================
  # STAGE 1: CI & Config Validation
  # ============================================================================
  validate:
    name: Lint & Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Validate Vector syntax (passing dummy env vars so validation succeeds)
      # Dummy env and vars specified, as these are defined in the current vector.toml
      # Omission would lead to crashes.
      - name: Validate Vector TOML Configuration
        uses: addnab/docker-run-action@v3
        with:
          image: timberio/vector:0.38.X-debian
          options: -v ${{ github.workspace }}:/workspace -w /workspace -e GCP_PROJECT_ID=dummy-project -e GCP_PUBSUB_TOPIC=dummy-topic
          run: |
            # Create a dummy credentials file so the schema check passes
            mkdir -p /etc/vector
            touch /etc/vector/gcp-key.json
            vector validate ./honeypot/control/vector.toml

      # Validate Docker Compose syntax
      - name: Validate Docker Compose Spec
        run: |
          cd honeypot/control
          docker compose config --quiet

  # ============================================================================
  # STAGE 2: Automated Deployment
  # ============================================================================
  deploy:
    name: Deploy Honeypot Node to AWS
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 Host Key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22222 16.16.156.14 >> ~/.ssh/known_hosts

      - name: Test Connection or Deploy
        run: |
          ssh -p 22222 ubuntu@16.16.156.14 "docker ps"
