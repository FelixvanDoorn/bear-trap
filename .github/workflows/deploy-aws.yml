name: Bear Trap AWS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'honeypot/control/**'
      - '.github/workflows/deploy-aws.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'honeypcontrol/**'
      - '.github/workflows/deploy-aws.yml'

jobs:
  # ============================================================================
  # STAGE 1: CI & Config Validation
  # ============================================================================
  validate:
    name: Lint & Validate Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Validate Vector syntax (passing dummy env vars so validation succeeds)
      # Dummy env and vars specified, as these are defined in the current vector.toml
      # Omission would lead to crashes.
      - name: Validate Vector TOML Configuration
        uses: addnab/docker-run-action@v3
        with:
          image: timberio/vector:0.38.X-debian
          options: >-
            -v ${{ github.workspace }}:/workspace
            -w /workspace
            -e GCP_PROJECT_ID=dummy-project
            -e GCP_PUBSUB_TOPIC=dummy-topic
            -e CLOUD_PROVIDER="ci-test"
            -e NODE_ROLE="ci-validator"
            -e SENSOR_REGION="ci-region"
          run: |
            vector validate ./honeypot/control/vector.toml

      # Validate Docker Compose syntax
      - name: Validate Docker Compose Spec
        run: |
          cd honeypot/control
          docker compose config --quiet

